<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Overwritten at runtime from the active locale. -->
    <title>Сертифікати «Година ШІ»</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232E51F4'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Text:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header>
      <h1 data-i18n="heading"></h1>
      <p class="lead" data-i18n="lead"></p>
    </header>

    <main class="layout">
      <section class="preview" data-i18n-aria-label="previewLabel">
        <canvas id="preview-canvas"></canvas>
        <nav class="pager" id="pager" hidden>
          <button type="button" id="prev" data-i18n-aria-label="prevLabel">◀</button>
          <span id="page-label">1 / 1</span>
          <button type="button" id="next" data-i18n-aria-label="nextLabel">▶</button>
        </nav>
      </section>

      <section class="input">
        <label for="names" data-i18n="namesLabel"></label>
        <textarea id="names" spellcheck="false" data-i18n-placeholder="namesPlaceholder"></textarea>
        <div class="input-row">
          <label class="file-button">
            <span data-i18n="uploadButton"></span>
            <input type="file" id="file" accept=".csv,.txt,text/csv,text/plain" hidden />
          </label>
          <span id="count"></span>
        </div>
        <p class="hint">
          <span data-i18n="hintCsv"></span>
          <a href="/examples/spysok-uchniv.csv" download data-i18n="exampleLink"></a>
        </p>
        <p class="hint" data-i18n="hintPrivacy"></p>
      </section>
    </main>

    <footer class="actions">
      <button type="button" id="generate" class="primary" data-i18n="generate"></button>
      <button type="button" id="download" data-i18n="download" disabled></button>
      <button type="button" id="print" data-i18n="print" disabled></button>
      <span id="status" role="status" aria-live="polite"></span>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
